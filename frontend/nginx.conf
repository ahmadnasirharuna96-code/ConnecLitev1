server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: let React Router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
